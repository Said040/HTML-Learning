<!DOCTYPE html>

<html>
  <head>
    <title>Youtube.com Clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
      p {
        font-family: Roboto, Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .thumbnail {
        width: 300px;
        display: block;
      }

      .searchBar {
        display: block;
      }

      .videoTitle {
        margin-top: 0px;
        margin-bottom: 12px;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
      }

      .videoPreview {
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
      }

      .channelProfile {
        display: inline-block;
        width: 50px;
        vertical-align: top;
      }
      .videoInfo {
        display: inline-block;
        width: 200px;
      }
      .profilePicture {
        width: 40px;
        border-radius: 50px;
      }
      .thumbnailRow {
        margin-bottom: 12px;
      }
      .videoAuthor,
      .videoStats {
        font-size: 12px;
        color: rgb(96,96,96);
      }

      .videoAuthor{
        margin-bottom: 4px;
      }
    </style>
  </head>

  <body>
    <input class="searchBar" type="textbox" placeholder="Search">

    <div class="videoPreview">
      <div class="thumbnailRow">
        <img class="thumbnail" src="thumbnails/marques.webp">
      </div>
      
      <div>
        <div class="channelProfile">
          <img class="profilePicture" src="channelProfile/marquesProfile.jpeg">
        </div>
        <div class="videoInfo">
          <p class="videoTitle">Talking Tech and AI with Google CEO Sundar Pichai!</p>
          <p class="videoAuthor">Marques Brownlee</p>
          <p class="videoStats">3.4M views &#183; 6 months ago</p>
        </div>
      </div>
    </div>

    <div class="videoPreview">
      <div class="thumbnailRow">
        <img class="thumbnail" src="thumbnails/mark.webp">
      </div>
    
      <div>
        <div class="channelProfile">
          <img class="profilePicture" src="channelProfile/markProfile.jpeg">
        </div>
        <div class="videoInfo">
          <p class="videoTitle">Try Not To Laugh Challenge #9</p>
          <p class="videoAuthor">Markiplier</p>
          <p class="videoStats">19M views &#183; 4 years ago</p>
        </div>
      </div>
    </div>
  </body>
</html>
