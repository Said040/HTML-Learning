<html> - needed for every webpage, its the standard
<head> - contains all elements that are NOT visible (website name)
<body> - contains all elements that are visible
-->

<!DOCTYPE html> 

<html>
  <head>
    <title>
      First Website
    </title>
  </head>

  <body>
    <p>
      paragraph of text
    </p>

    <button>
      Helloo
    </button>

    <a href="https://youtube.com" target="_blank">
      Link to Youtube
    </a>
    
  </body>
</html>
