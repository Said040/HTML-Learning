<!-- 
 Background-Color - Background Color
 Color - Text Color
 Border - Controls the outline 
 Border-Radius - Corners of the button
 Height/Width - Can be controlled by px
 Cursor - Effects when cursor is hovering
 Margin - The actual space between elements
 .NAME (ex: .subscribe-button) - A name given to a class that only 
                                affects the specific element
 font - Style of the text (bold, italicize, font style, text size, etc)

-->
<style>
  .subscribe-button {
    background-color: rgb(200, 0, 0);
    color: white; 
    border: none;
    height: 36px;
    width: 105px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
  }
  .join-button {
    background-color: white;
    border-color: rgb(41, 118, 211);
    border-style: solid;
    border-width: 1px;    
    color: rgb(41, 118, 211);
    height: 36px;
    width: 62px;
    border-radius: 2px;
    cursor: pointer;
  }
  .tweet-button {
    background-color: rgb(2, 158, 255);
    color: white;
    border: none;
    height: 36px;
    width: 74px;
    border-radius: 18px;
    font-weight: bold;
    font-size: 15;
    cursor: pointer;
    margin-left: 8px;
  }
</style>

<button class="subscribe-button">
  SUBSCRIBE
</button>

<button class="join-button">
  JOIN
</button>

<button class="tweet-button">
  Tweet
</button>
